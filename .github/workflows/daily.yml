# Daily pipeline cron — INTENTIONALLY DISABLED.
#
# Every line below is commented out on purpose: this workflow is checked in as
# the blueprint for PLAN.md §7's unattended morning run, but it must not go
# live until we choose to flip it on. Until then, the daily run is local:
#
#     python3 run_daily.py            # or: python3 -m pipeline daily
#
# To enable:
#   1. Uncomment everything below this header block.
#   2. Add ODDS_API_KEY to the repo's Actions secrets (Settings → Secrets and
#      variables → Actions) — or delete that env line to run odds-blind.
#   3. Commit to the default branch; check the run in the Actions tab.
#
# Design notes (why the workflow looks like this):
#   * Actions runners are ephemeral, so yesterday's picks would vanish between
#     runs — grading depends on them. The commit-back step persists
#     data/predictions/ and data/reports/ to the repo after each run; that is
#     also the PLAN.md §7 wish-list "daily report artifact, committed".
#   * The cron fires at 10:30 UTC (~6:30am ET), after every US game is final.
#   * `|| true` is NOT used: a failed stage exits nonzero, the run shows red,
#     and GitHub emails the failure — the free version of §7's alerting.
#
# ---------------------------------------------------------------------------
#
