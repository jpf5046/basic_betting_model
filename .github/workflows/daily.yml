# Daily pipeline cron — ENABLED (was the PLAN.md §7 blueprint, flipped on now
# that ODDS_API_KEY / DATABASE_URL are configured in the repo settings).
#
# Design notes (why the workflow looks like this):
#   * Actions runners are ephemeral, so yesterday's picks would vanish between
#     runs — grading depends on them. The commit-back step persists
#     data/predictions/, data/reports/, and data/frames/ to the repo after
#     each run; that is also the PLAN.md §7 wish-list "daily report artifact,
#     committed".
#   * The cron fires at 10:30 UTC (~6:30am ET), after every US game is final.
#   * `|| true` is NOT used on the pipeline stages: a failed stage exits
#     nonzero, the run shows red, and GitHub emails the failure — the free
#     version of §7's alerting.
#   * Secrets/vars: ODDS_API_KEY and DATABASE_URL are read from Actions
#     secrets, falling back to repo variables. Odds and the Postgres mirror
#     each degrade gracefully (skipped) when their value is absent.
#   * First-time setup: run the "backfill" workflow once before this cron has
#     anything to grade or mirror — it seeds the season's games and frames.

name: daily

on:
  schedule:
    - cron: "30 10 * * *"   # 10:30 UTC daily (~6:30am ET)
  workflow_dispatch: {}      # manual "Run workflow" button for missed days

permissions:
  contents: write            # needed by the commit-back step

concurrency:
  group: pipeline-data       # shared with backfill.yml — never interleave commits
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the offline test suite first
        run: python3 -m unittest discover -s tests

      # Prints whether the two optional inputs reached the run — length only,
      # never the value (and GitHub masks secret values in logs anyway). If
      # either says MISSING, it's a repo-settings problem, not a code one:
      # the secret must live under Settings → Secrets and variables → Actions
      # → Repository secrets (not an Environment / Dependabot / org scope).
      - name: Check pipeline secrets are visible to this run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || vars.ODDS_API_KEY }}
        run: |
          if [ -n "$ODDS_API_KEY" ]; then echo "ODDS_API_KEY: present (${#ODDS_API_KEY} chars)"; else echo "ODDS_API_KEY: MISSING — odds + edge stages will be skipped"; fi
          if [ -n "$DATABASE_URL" ]; then echo "DATABASE_URL: present"; else echo "DATABASE_URL: MISSING — Postgres mirror will be skipped (SQLite used locally)"; fi

      # --allow-partial: an off-season or unreachable feed for one sport (e.g.
      # NBA in July) is reported but does not red the whole run — the sports
      # that fetched still publish and commit. A total feed outage (every sport
      # fails) or a later-stage bug still fails the run and emails you.
      - name: Run the daily pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY || vars.ODDS_API_KEY }}
        run: python3 run_daily.py --allow-partial

      # Idempotent full-season rebuild: keeps the labeled canonical frame in
      # sync with the finals that today's ingest just fetched.
      - name: Rebuild the labeled frames
        run: python3 -m pipeline.backfill

      - name: Mirror CSVs into Postgres
        if: env.DATABASE_URL != ''
        run: |
          pip install "psycopg[binary]"
          python3 -m pipeline.db init
          python3 -m pipeline.db load

      - name: Upload the daily report as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: |
            data/reports/
            data/predictions/
          if-no-files-found: ignore

      - name: Commit results back (picks must survive until tomorrow's grading)
        if: always()
        run: |
          git config user.name "daily-pipeline[bot]"
          git config user.email "daily-pipeline@users.noreply.github.com"
          # -A over the whole data/ tree: stages new + modified + deleted and,
          # crucially, never aborts on a not-yet-existent subdir (data/frames
          # before the first backfill) the way an explicit pathspec list does.
          # .gitignore keeps data/raw/ and data/model.db out.
          git add -A data || true
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F)"
          git push
